l="#172033" font-size="25">Select a useful</text><text x="740.0" y="270" text-anchor="middle" fill="#172033" font-size="25">representation</text><rect x="886.0" y="78" width="268.0" height="250" rx="20" fill="#e9f4fc"/><circle cx="1020.0" cy="114" r="24" fill="#0a3476"/><text x="1020.0" y="123" text-anchor="middle" fill="white" font-size="27" font-weight="800">4</text><text x="1020.0" y="166" text-anchor="middle" fill="#082759" font-size="26" font-weight="800">Evidence</text><text x="1020.0" y="238" text-anchor="middle" fill="#172033" font-size="25">Listen for the</text><text x="1020.0" y="270" text-anchor="middle" fill="#172033" font-size="25">student explanation</text><path d="M30 394h190l25 26-25 26H30z" fill="#082759"/><text x="52" y="429" font-size="25" fill="white" font-weight="800">KEY IDEA</text><text x="266" y="428" font-size="25" fill="#082759">Choose the tool after the learning goal and evidence.</text></g></svg>