<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc"><title id="title">Teacher-directed EIIR cycle</title><desc id="desc">EMPOWER: Choose a goal → IMPLEMENT: Record practice → INVESTIGATE: Review evidence → REALIZE: Test and revisit</desc><rect width="1100" height="260" rx="25" fill="#f8f3e5"/><rect x="30.0" y="50" width="237.5" height="150" rx="18" fill="#ffffff" stroke="#d5962b" stroke-width="3"/><text x="148.75" y="108" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#174c5b">EMPOWER</text><text x="148.75" y="155" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#082759">Choose a goal</text><path d="M 272.5 124 h 20 m -7 -7 l 7 7 l -7 7" fill="none" stroke="#a54d58" stroke-width="4"/><rect x="297.5" y="50" width="237.5" height="150" rx="18" fill="#ffffff" stroke="#d5962b" stroke-width="3"/><text x="416.25" y="108" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#174c5b">IMPLEMENT</text><text x="416.25" y="155" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#082759">Record practice</text><path d="M 540.0 124 h 20 m -7 -7 l 7 7 l -7 7" fill="none" stroke="#a54d58" stroke-width="4"/><rect x="565.0" y="50" width="237.5" height="150" rx="18" fill="#ffffff" stroke="#d5962b" stroke-width="3"/><text x="683.75" y="108" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#174c5b">INVESTIGATE</text><text x="683.75" y="155" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#082759">Review evidence</text><path d="M 807.5 124 h 20 m -7 -7 l 7 7 l -7 7" fill="none" stroke="#a54d58" stroke-width="4"/><rect x="832.5" y="50" width="237.5" height="150" rx="18" fill="#ffffff" stroke="#d5962b" stroke-width="3"/><text x="951.25" y="108" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#174c5b">REALIZE</text><text x="951.25" y="155" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#082759">Test and revisit</text></svg>