<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="A concept Bingo card becomes a learning task when each choice is explained"><title>A concept Bingo card becomes a learning task when each choice is explained</title><rect width="1200" height="400" rx="25" fill="#f8f3e5"/><g font-family="system-ui,sans-serif" fill="#082759"><rect x="30" y="25" width="180" height="108" rx="15" fill="#e5f3fb" stroke="#28657a" stroke-width="2"/><text x="120" y="86" font-size="27" text-anchor="middle" font-weight="750">Retrieval</text><rect x="220" y="25" width="180" height="108" rx="15" fill="#e5f3fb" stroke="#28657a" stroke-width="2"/><text x="310" y="86" font-size="27" text-anchor="middle" font-weight="750">Explain</text><rect x="410" y="25" width="180" height="108" rx="15" fill="#e5f3fb" stroke="#28657a" stroke-width="2"/><text x="500" y="86" font-size="27" text-anchor="middle" font-weight="750">Evidence</text><rect x="30" y="143" width="180" height="108" rx="15" fill="#e5f3fb" stroke="#28657a" stroke-width="2"/><text x="120" y="204" font-size="27" text-anchor="middle" font-weight="750">Feedback</text><rect x="220" y="143" width="180" height="108" rx="15" fill="#fff0cd" stroke="#28657a" stroke-width="2"/><text x="310" y="204" font-size="27" text-anchor="middle" font-weight="750">FREE</text><rect x="410" y="143" width="180" height="108" rx="15" fill="#e5f3fb" stroke="#28657a" stroke-width="2"/><text x="500" y="204" font-size="27" text-anchor="middle" font-weight="750">Reflect</text><rect x="30" y="261" width="180" height="108" rx="15" fill="#e5f3fb" stroke="#28657a" stroke-width="2"/><text x="120" y="322" font-size="27" text-anchor="middle" font-weight="750">Shared goal</text><rect x="220" y="261" width="180" height="108" rx="15" fill="#e5f3fb" stroke="#28657a" stroke-width="2"/><text x="310" y="322" font-size="27" text-anchor="middle" font-weight="750">Check</text><rect x="410" y="261" width="180" height="108" rx="15" fill="#e5f3fb" stroke="#28657a" stroke-width="2"/><text x="500" y="322" font-size="27" text-anchor="middle" font-weight="750">Elaborate</text><text x="680" y="65" font-size="32" text-anchor="start" font-weight="800">Think</text><text x="680" y="112" font-size="28" text-anchor="start" font-weight="500">Choose before comparing.</text><text x="680" y="180" font-size="32" text-anchor="start" font-weight="800">Mark</text><text x="680" y="227" font-size="28" text-anchor="start" font-weight="500">Show your first choice.</text><text x="680" y="295" font-size="32" text-anchor="start" font-weight="800">Explain</text><text x="680" y="342" font-size="28" text-anchor="start" font-weight="500">Tell us why it fits.</text></g></svg>