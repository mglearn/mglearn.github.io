<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Four ways to contribute to one shared explanation"><title>Four ways to contribute to one shared explanation</title><rect width="1200" height="400" rx="25" fill="#f8f3e5"/><g font-family="system-ui,sans-serif" fill="#082759"><path d="M285 115L600 200L915 115M285 290L600 200L915 290" stroke="#28657a" stroke-width="5" fill="none"/><rect x="30" y="35" width="400" height="125" rx="24" fill="#e7f3fa" stroke="#b79750"/><text x="50" y="79" font-size="30" text-anchor="start" font-weight="800">Navigator</text><text x="50" y="118" font-size="23" text-anchor="start" font-weight="500">Invite others to guide the</text><text x="50" y="146" font-size="23" text-anchor="start" font-weight="500">next click.</text><rect x="770" y="35" width="400" height="125" rx="24" fill="#e7f3fa" stroke="#b79750"/><text x="790" y="79" font-size="30" text-anchor="start" font-weight="800">Explainer</text><text x="790" y="118" font-size="23" text-anchor="start" font-weight="500">Say why the choice makes</text><text x="790" y="146" font-size="23" text-anchor="start" font-weight="500">sense.</text><rect x="30" y="235" width="400" height="125" rx="24" fill="#e7f3fa" stroke="#b79750"/><text x="50" y="279" font-size="30" text-anchor="start" font-weight="800">Questioner</text><text x="50" y="318" font-size="23" text-anchor="start" font-weight="500">Ask for evidence or an</text><text x="50" y="346" font-size="23" text-anchor="start" font-weight="500">example.</text><rect x="770" y="235" width="400" height="125" rx="24" fill="#e7f3fa" stroke="#b79750"/><text x="790" y="279" font-size="30" text-anchor="start" font-weight="800">Connector</text><text x="790" y="318" font-size="23" text-anchor="start" font-weight="500">Link our discovery to a</text><text x="790" y="346" font-size="23" text-anchor="start" font-weight="500">learning goal.</text><circle cx="600" cy="200" r="122" fill="#fff0cd" stroke="#28657a" stroke-width="4"/><text x="600" y="165" font-size="28" text-anchor="middle" font-weight="800">Our shared</text><text x="600" y="203" font-size="30" text-anchor="middle" font-weight="800">explanation</text><text x="600" y="248" font-size="22" text-anchor="middle" font-weight="500">Every voice matters</text></g></svg>