<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Our fifty-minute plan: play, connect, explore, share, adapt, and check"><title>Our fifty-minute plan: play, connect, explore, share, adapt, and check</title><rect width="1200" height="400" rx="25" fill="#f8f3e5"/><g font-family="system-ui,sans-serif" fill="#082759"><rect x="25" y="80" width="180" height="240" rx="22" fill="#e8f4fc" stroke="#abc4d4"/><text x="115" y="135" font-size="32" text-anchor="middle" font-weight="800">0–9</text><text x="115" y="205" font-size="31" text-anchor="middle" font-weight="800">Play</text><text x="115" y="265" font-size="24" text-anchor="middle" font-weight="500">Concept Bingo</text><rect x="220" y="80" width="180" height="240" rx="22" fill="#e4f5ee" stroke="#abc4d4"/><text x="310" y="135" font-size="32" text-anchor="middle" font-weight="800">9–18</text><text x="310" y="205" font-size="31" text-anchor="middle" font-weight="800">Connect</text><text x="310" y="265" font-size="24" text-anchor="middle" font-weight="500">Every voice</text><rect x="415" y="80" width="180" height="240" rx="22" fill="#fff3d7" stroke="#abc4d4"/><text x="505" y="135" font-size="32" text-anchor="middle" font-weight="800">18–34</text><text x="505" y="205" font-size="31" text-anchor="middle" font-weight="800">Explore</text><text x="505" y="265" font-size="24" text-anchor="middle" font-weight="500">Two activities</text><rect x="610" y="80" width="180" height="240" rx="22" fill="#e8f4fc" stroke="#abc4d4"/><text x="700" y="135" font-size="32" text-anchor="middle" font-weight="800">34–42</text><text x="700" y="205" font-size="31" text-anchor="middle" font-weight="800">Share</text><text x="700" y="265" font-size="24" text-anchor="middle" font-weight="500">One discovery</text><rect x="805" y="80" width="180" height="240" rx="22" fill="#e4f5ee" stroke="#abc4d4"/><text x="895" y="135" font-size="32" text-anchor="middle" font-weight="800">42–47</text><text x="895" y="205" font-size="31" text-anchor="middle" font-weight="800">Adapt</text><text x="895" y="265" font-size="24" text-anchor="middle" font-weight="500">Classroom goal</text><rect x="1000" y="80" width="180" height="240" rx="22" fill="#fff3d7" stroke="#abc4d4"/><text x="1090" y="135" font-size="32" text-anchor="middle" font-weight="800">47–50</text><text x="1090" y="205" font-size="31" text-anchor="middle" font-weight="800">Check</text><text x="1090" y="265" font-size="24" text-anchor="middle" font-weight="500">Explain again</text></g></svg>