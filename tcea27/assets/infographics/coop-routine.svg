<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Think independently, try together, explain with evidence, and revise"><title>Think independently, try together, explain with evidence, and revise</title><rect width="1200" height="400" rx="25" fill="#f8f3e5"/><g font-family="system-ui,sans-serif" fill="#082759"><circle cx="155" cy="130" r="50" fill="#28657a"/><text x="155" y="145" text-anchor="middle" fill="white" font-size="40">1</text><text x="155" y="230" font-size="34" text-anchor="middle" font-weight="800">Think</text><text x="155" y="285" font-size="22" text-anchor="middle" font-weight="500">Make your own choice.</text><path d="M220 130h90l-18-12m18 12-18 12" stroke="#925100" stroke-width="6" fill="none"/><circle cx="450" cy="130" r="50" fill="#28657a"/><text x="450" y="145" text-anchor="middle" fill="white" font-size="40">2</text><text x="450" y="230" font-size="34" text-anchor="middle" font-weight="800">Try</text><text x="450" y="285" font-size="22" text-anchor="middle" font-weight="500">Work on the shared task.</text><path d="M515 130h90l-18-12m18 12-18 12" stroke="#925100" stroke-width="6" fill="none"/><circle cx="745" cy="130" r="50" fill="#28657a"/><text x="745" y="145" text-anchor="middle" fill="white" font-size="40">3</text><text x="745" y="230" font-size="34" text-anchor="middle" font-weight="800">Explain</text><text x="745" y="285" font-size="22" text-anchor="middle" font-weight="500">Say why; ask a question.</text><path d="M810 130h90l-18-12m18 12-18 12" stroke="#925100" stroke-width="6" fill="none"/><circle cx="1040" cy="130" r="50" fill="#28657a"/><text x="1040" y="145" text-anchor="middle" fill="white" font-size="40">4</text><text x="1040" y="230" font-size="34" text-anchor="middle" font-weight="800">Revise</text><text x="1040" y="285" font-size="22" text-anchor="middle" font-weight="500">Use the evidence to improve.</text></g></svg>